<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0b1530">
  <title>Portal ARCA — acesso movido</title>
  <meta name="description" content="O Portal ARCA foi movido para a Central Interna do Control IA.">
  <link rel="canonical" href="https://controlia.arca.net.br/central-interna">
  <meta http-equiv="refresh" content="0;url=https://controlia.arca.net.br/central-interna">
  <script>
    window.location.replace("https://controlia.arca.net.br/central-interna");
  </script>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f4f7fb;
      color: #0b1530;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #0b1530 0%, #123c6b 100%);
    }
    main {
      width: min(560px, 100%);
      padding: 40px 32px;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 24px 64px rgba(3, 13, 30, 0.28);
      text-align: center;
    }
    h1 { margin: 0 0 16px; font-size: clamp(1.5rem, 4vw, 2rem); }
    p { margin: 0 0 20px; line-height: 1.6; color: #33415c; }
    a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 8px;
      background: #0b63ce;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover, a:focus-visible { background: #084a9b; }
    small { display: block; margin-top: 20px; color: #5b6880; }
  </style>
</head>
<body>
  <main>
    <h1>Portal ARCA</h1>
    <p>O Portal ARCA foi movido para a Central Interna do Control IA.</p>
    <a href="https://controlia.arca.net.br/central-interna">Acessar a Central Interna</a>
    <small>Se o redirecionamento não acontecer automaticamente, use o link acima.</small>
  </main>
</body>
</html>
